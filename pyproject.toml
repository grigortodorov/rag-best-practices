[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragpractices"
version = "0.9.0"
description = "Small toolkit helpers for RAG chunking, document ingest, HTML ingest, hybrid search stubs, query rewrite, rerank, context packing, groundedness checks, claim-level support / entity faithfulness, citations, offline retrieval eval, strategy compare, chunking A/B, citation span checks, lost-in-the-middle stress, index canaries, grounded prompts, metadata/ACL filters, fail-closed abstain, configurable pipelines, chunk quality, answer rubrics, and design checklists."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "grigortodorov" },
]
keywords = [
  "rag",
  "chunking",
  "ingest",
  "hybrid-search",
  "rerank",
  "packing",
  "groundedness",
  "claim-check",
  "anti-hallucination",
  "citations",
  "retrieval",
  "evaluation",
  "abstain",
  "pipeline",
  "checklist",
  "strategy-compare",
  "chunking-ab",
  "canary",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ragpractices = "ragpractices.cli:main"

[project.urls]
Homepage = "https://github.com/grigortodorov/rag-best-practices"
Documentation = "https://github.com/grigortodorov/rag-best-practices/blob/main/docs/13-toolkit.md"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/ragpractices"]
